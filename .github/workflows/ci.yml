name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests and synthetic demo
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run tests
        run: pytest -q

      - name: Run synthetic demo
        run: python scripts/run_synthetic_demo.py

      - name: Validate generated official record
        run: isaac validate /tmp/isaac-demo/01JQZ0SYNTHXANESDEMO000000.json --official

      - name: Validate generated official record with advisory warnings
        run: isaac validate /tmp/isaac-demo/01JQZ0SYNTHXANESDEMO000000.json --official --warnings

      - name: Audit generated record evidence
        run: isaac audit --records-dir /tmp/isaac-demo

  frontend:
    name: frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  browser-a11y:
    name: browser accessibility and responsive baseline
    runs-on: ubuntu-latest

    # A NEW, additive job. It does not modify, gate or depend on `test` or
    # `frontend`; those two remain exactly as they were.
    #
    # What it does: boots the FastAPI backend with NO database and NO
    # credentials, seeds the committed synthetic fixtures through the
    # idempotent /api/demo/run route, then runs the Playwright suite
    # (Chromium only) across five viewport/zoom projects.
    #
    # What it deliberately does NOT do: contact any database (no PG* variable
    # is ever set), publish an image, write to the workspace beyond the
    # synthetic seed, or touch the hosted /krish deployment — which is behind
    # an Authentik edge and is not reachable from CI at all.

    env:
      # Must stay 5173: it is the port the backend's DEFAULT CORS allow-list
      # permits (apps/api/isaac_api/app.py → DEFAULT_CORS_ORIGINS).
      E2E_WEB_PORT: "5173"
      E2E_API_BASE: "http://127.0.0.1:8000/api"
      # Ephemeral, runner-local workspace. Nothing persists past the job.
      ISAAC_UI_WORKSPACE: /tmp/isaac-e2e-workspace

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start backend (no database, no credentials, synthetic only)
        run: |
          nohup uvicorn isaac_api.app:app --app-dir apps/api \
            --host 127.0.0.1 --port 8000 > /tmp/isaac-api.log 2>&1 &
          echo "started"

      - name: Wait for backend readiness (bounded ~60s)
        run: |
          ready=""
          last="000"
          for _ in $(seq 1 30); do
            last=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            if [ "$last" = "200" ]; then ready="yes"; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::backend not ready within ~60s (last health code=$last)"
            echo "---- backend log ----"
            cat /tmp/isaac-api.log || true
            exit 1
          fi
          echo "backend ready (health=200)"

      - name: Confirm synthetic-only mode
        run: |
          mode=$(curl -s http://127.0.0.1:8000/api/health | jq -r '.mode // empty')
          [ "$mode" = "synthetic-only" ] || {
            echo "::error::expected mode=synthetic-only, got '$mode'"; exit 1; }
          echo "mode=$mode"

      # The suite's own global-setup ALSO seeds (idempotently). Doing it here
      # too keeps the failure legible: a seeding problem shows up as a curl
      # step, not as 470 browser tests timing out.
      - name: Seed the synthetic workspace
        run: |
          curl -sS -X POST http://127.0.0.1:8000/api/demo/run \
            -H 'content-type: application/json' -d '{"mode":"draft_only"}' -o /tmp/seed.json
          jq -e '.experiment_id' /tmp/seed.json > /dev/null
          count=$(curl -s http://127.0.0.1:8000/api/experiments | jq '.experiments | length')
          [ "$count" -ge 5 ] || { echo "::error::expected >=5 seeded experiments, got $count"; exit 1; }
          echo "seeded experiments: $count"

      - name: Typecheck the e2e suite
        working-directory: apps/web
        run: npm run typecheck:e2e

      - name: Run browser accessibility and responsive suite
        working-directory: apps/web
        run: npm run test:e2e

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/isaac-api.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
