name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded run when a new commit lands on the SAME ref, so a fresh
# push to an open PR does not leave the previous ~30-minute run queued behind it
# (the org's Actions minutes are finite). Keyed by ref, so each PR branch and
# `main` get their own group and never cancel each other.
#
# cancel-in-progress is TRUE for pull_request events only. For a push to `main`
# (a merge commit — a distinct, releasable SHA) it is FALSE: every merged SHA
# must be fully validated, never cancelled by the next merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: tests and synthetic demo
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      # THE FILESYSTEM FALLBACK IS COVERED BY THIS JOB, AND ONLY BECAUSE THIS JOB
      # HAS NO DATABASE. That is currently true by omission — nothing here sets
      # `PGHOST` — and a property held by omission is one a later edit can remove
      # without anyone noticing. `experiment_repository.repository()` selects the
      # filesystem backend precisely when `PGHOST` is unset, so if a future change
      # added a service container to this job "for convenience", every test in it
      # would silently start exercising the Postgres path and the fallback that
      # every developer machine actually runs would stop being tested anywhere.
      #
      # Asserting it costs one line and turns the omission into a stated contract.
      # The dedicated `postgres-migration` job below is where the durable path is
      # exercised, deliberately separately.
      - name: Assert this job has NO database, so the filesystem fallback is exercised
        run: |
          set -euo pipefail
          if [ -n "${PGHOST:-}" ]; then
            echo "::error::PGHOST is set in the default test job (\"${PGHOST}\"). This job must"
            echo "::error::run without a database so the filesystem repository stays covered."
            exit 1
          fi
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "apps/api")
          from isaac_api import experiment_repository as repo
          selected = repo.repository()
          assert selected.backend == repo.BACKEND_FILESYSTEM, selected.backend
          assert selected.durable is False
          assert repo.storage_status() == {
              "configured": False,
              "backend": "filesystem",
              "durable": False,
              "state": repo.STORAGE_STATE_EPHEMERAL,
          }, repo.storage_status()
          print("no database configured: filesystem repository selected, durability NOT claimed")
          PY

      - name: Run tests
        run: pytest -q

      - name: Run synthetic demo
        run: python scripts/run_synthetic_demo.py

      - name: Validate generated official record
        run: isaac validate /tmp/isaac-demo/01JQZ0SYNTHXANESDEMO000000.json --official

      - name: Validate generated official record with advisory warnings
        run: isaac validate /tmp/isaac-demo/01JQZ0SYNTHXANESDEMO000000.json --official --warnings

      - name: Audit generated record evidence
        run: isaac audit --records-dir /tmp/isaac-demo

  postgres-migration:
    name: migration and durable repository against a real PostgreSQL
    runs-on: ubuntu-latest

    # A NEW, ADDITIVE job. It does not modify, gate or depend on `test`, and that
    # separation is the point rather than a convenience:
    #
    #   * `test` keeps running with NO `PGHOST`, so the FILESYSTEM fallback stays
    #     exercised on every single run. If this job ever became the only place the
    #     repository is tested, the fallback would silently stop being covered —
    #     and the fallback is what every developer machine and every other CI job
    #     actually uses.
    #   * this job adds the one thing an in-process fake cannot give:
    #     whether the SQL is valid PostgreSQL, whether the migration is genuinely
    #     idempotent, and whether it touches anything it does not own.
    #
    # WHAT THIS PROVES AND WHAT IT DOES NOT — stated here because the difference is
    # what the owner is being asked to weigh:
    #
    #   PROVEN: the migrations apply to an empty database; applying them a second
    #   time changes nothing; they create ONLY this application's three tables (a
    #   before/after diff of `information_schema.tables`); a pre-existing `records`
    #   table is byte-identical afterwards; the documented rollbacks return the
    #   database to its pre-migration table set with `records` intact; and the
    #   repository's create / read-back / list / tutorial-refusal behaviour works
    #   against a real engine.
    #
    #   ADDED FOR `0002_runs`: that the app is unaffected by 0002 whether it is
    #   PENDING (a database migrated to 0001 only — the hosted state as of
    #   2026-08-09) or APPLIED (`isaac_runs` stays empty while the app runs); that
    #   every constraint the approval packet claims actually rejects what it claims
    #   to reject, against a real engine; that the foreign key REFUSES a parent
    #   delete rather than cascading; and that rolling the two back in the WRONG
    #   ORDER fails loudly and destroys nothing.
    #
    #   ADDED AFTER REVIEW: that the identity CHECK ADMITS the legacy run document
    #   THIS APPLICATION ACTUALLY PRODUCES — `Run.to_state()` emits
    #   `"experiment_id": ""`, not a missing key, and the original CHECK refused
    #   it while the fixture's bare `'{}'` passed. The document under test is
    #   generated by the application in the step itself rather than hand-written,
    #   because a hand-written approximation is exactly what let the false
    #   "legacy-tolerant by construction" claim stand.
    #
    #   NOT PROVEN: how any of this behaves against the HOSTED database with its
    #   real 30-row production-derived dataset, its roles, and its existing
    #   grants. This job removes the "is this even valid SQL / is it idempotent /
    #   does it touch other tables" class of risk. It does not remove the "does it
    #   behave correctly against the real data" class. Only the owner applying it,
    #   deliberately, resolves that.
    #
    # VERSION PARITY: `docs/postgres-test-db-guide.md` states the SLAC cluster runs
    # Postgres 18, so the service container is pinned to 18. That is documented
    # parity, not measured parity — this environment cannot reach the hosted
    # server to confirm the running version.
    #
    # NOTHING HERE TOUCHES ANY REAL DATABASE. The service container is created and
    # destroyed by this job. No SLAC credential, kubeconfig or port-forward is used
    # or requested, and the hosted deployment is not contacted at all.

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: metadata_assistant
          POSTGRES_PASSWORD: throwaway-ci-password
          # Must match `db_write.EXPECTED_DATABASE`: the write path gates on the
          # name and then pins it from a constant, so a differently-named database
          # would be refused before a connection was attempted — which is the
          # behaviour under test, not a setup detail to work around.
          POSTGRES_DB: metadata_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metadata_assistant -d metadata_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: metadata_assistant
      PGPASSWORD: throwaway-ci-password
      PGDATABASE: metadata_assistant
      # The service container speaks plaintext on localhost. The pod's default is
      # `require`; overridden here because there is no TLS on a loopback container,
      # and this is the ONLY place that override is acceptable.
      PGSSLMODE: disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Report the engine version actually under test
        run: |
          set -euo pipefail
          psql -Atc "select version()"

      # A STAND-IN for the production-derived sample. Its shape is taken from
      # `db_provider.Q_RECORD_PAGE` ("SELECT record_id, data FROM records"). Its
      # CONTENT is obviously synthetic — no production record is used, quoted, or
      # needed to prove the property, which is that the migration does not touch
      # this table at all.
      - name: Seed a stand-in `records` table and capture its exact contents
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE records (record_id char(26) PRIMARY KEY, data jsonb NOT NULL);
          INSERT INTO records (record_id, data) VALUES
            ('01SYNTHETICSTANDIN00000001', '{"synthetic": true, "n": 1}'),
            ('01SYNTHETICSTANDIN00000002', '{"synthetic": true, "n": 2}');
          SQL
          psql -Atc "select md5(string_agg(record_id || data::text, '|' order by record_id)) from records" \
            > /tmp/records-before.txt
          psql -Atc "select table_name from information_schema.tables where table_schema='public' order by table_name" \
            > /tmp/tables-before.txt
          echo "records digest before: $(cat /tmp/records-before.txt)"
          cat /tmp/tables-before.txt

      # ==================================================================
      # A DATABASE IS CONFIGURED AND THE MIGRATION IS NOT YET APPLIED — the state
      # this whole job previously skipped over.
      #
      # RE-DATED 2026-08-09, AND THE STEP ITSELF IS UNCHANGED. This block used to
      # open "THE STATE THE DEPLOYED POD IS ACTUALLY IN" and insist "it is not a
      # hypothetical". That was true when it was written and it is not true now:
      # Dean applied `0001_experiments` to the hosted database on 2026-08-09, and
      # `/api/health` there reports `experiment_storage: {backend: "postgres",
      # durable: true, state: "durable"}` — measured, see
      # `docs/evidence/hosted-0001-verification-2026-08-09.md`.
      #
      # WHAT THIS STEP PROVES IS STILL A LIVE PROPERTY, which is why nothing below
      # was weakened or removed. The un-migrated state is now the state of a FRESH
      # environment, of a ROLLED-BACK one, and of the window before any future
      # migration (`0002`) is applied. Only the justification needed re-dating.
      #
      # The mechanism is unchanged and still holds: `docs/postgres-test-db-guide.md`
      # states that `PGHOST` is already set in the deployed pod, and `PGDATABASE`
      # there is exactly `db_write.EXPECTED_DATABASE` — so the durable backend
      # selects itself on the next image roll, while a migration is deliberately
      # applied by an operator and not at boot. Every statement against a table
      # that has not been created yet therefore raises.
      #
      # WHAT THAT USED TO DO, measured before the fix: `GET /api/experiments` → 500
      # (My Experiments, the product's primary screen, rendered "Backend Not
      # Running"), `GET /api/experiments/<id>` → 500 where it had returned a clean
      # 404, and `POST /api/experiments` → 500 — while `/api/health` went on
      # reporting `durable: true` and the UI went on promising durability. The same
      # three 500s would have returned on any transient outage, permanently, on a
      # read path that had no database dependency at all before this feature.
      #
      # THIS STEP RUNS FIRST, DELIBERATELY. Every step below it applies the
      # migration, so this is the only point in the job at which the un-migrated
      # state exists. Putting it here is what makes the omission impossible to
      # repeat: the job cannot reach "apply" without having proven the state before
      # it degrades rather than crashes.
      - name: Prove the app DEGRADES when the migration has not been applied yet
        env:
          ISAAC_UI_WORKSPACE: /tmp/isaac-pg-unmigrated
        run: |
          set -euo pipefail
          # The table must genuinely not exist, or this step proves nothing.
          count=$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='isaac_experiments'")
          [ "$count" = "0" ] || { echo "::error::isaac_experiments already exists; this step must run BEFORE the migration"; exit 1; }
          python - <<'PY'
          import sys
          sys.path.insert(0, "apps/api")
          from fastapi.testclient import TestClient
          import isaac_api.experiment_repository as repo
          import isaac_api.workspace as ws
          from isaac_api.app import create_app

          client = TestClient(create_app(), raise_server_exceptions=False)

          # The durable backend really is selected — otherwise this step would be
          # asserting the filesystem fallback all over again and would pass for the
          # wrong reason.
          assert repo.repository().backend == repo.BACKEND_POSTGRES, repo.repository().backend

          # A record an earlier pod (which had no database) left on disk. The list
          # must still show it: "degraded" means the filesystem VIEW, not an empty
          # one, and an empty list would pass a weaker version of this assertion for
          # entirely the wrong reason.
          #
          # The state file is placed DIRECTLY rather than through
          # `ws.create_experiment`, because that helper writes through the durable
          # store — which is the very thing that fails here.
          import json, pathlib
          rid = "01CIUNMIGRATEDFIXTURE00000"
          state = {
              "id": rid,
              "title": "Written before the roll",
              "created_utc": "2026-01-01T00:00:00Z",
              "source": repo.new_experiment_source(),
              "draft": {},
              "generation": "ci",
          }
          d = pathlib.Path(ws.workspace_root()) / rid
          d.mkdir(parents=True, exist_ok=True)
          (d / "experiment.json").write_text(json.dumps(state, indent=2) + "\n")

          # 1. THE LIST DEGRADES. 200, with the filesystem view — never 500.
          listed = client.get("/api/experiments")
          assert listed.status_code == 200, (listed.status_code, listed.text[:400])
          ids = [row["id"] for row in listed.json()["experiments"]]
          assert ids == [rid], ids

          # 2. A MISS STAYS A 404. It was a clean 404 before durable storage existed
          #    and it must not have become a server error.
          missing = client.get("/api/experiments/01ARZ3NDEKTSV4RRFFQ69G5FAV")
          assert missing.status_code == 404, (missing.status_code, missing.text[:400])

          # 3. A KNOWN ID STILL LOADS, from the filesystem.
          assert client.get(f"/api/experiments/{rid}").status_code == 200

          # 4. THE WRITE FAILS LOUDLY AND TYPED — 503, not 500, and not a silent
          #    ephemeral write. The reader was told their work is durable; a create
          #    that could not keep it must say so rather than look like it worked.
          created = client.post("/api/experiments", json={"title": "CI unmigrated"})
          assert created.status_code == 503, (created.status_code, created.text[:400])
          assert created.json()["error"] == "experiment_storage_unavailable", created.text
          for leak in ("127.0.0.1", "PGHOST", "PGPASSWORD", "throwaway-ci-password"):
              assert leak not in created.text, leak

          # 5. THE DURABILITY CLAIM IS GONE. This is what stops the UI promising
          #    durability on a deployment where creating cannot work.
          storage = client.get("/api/health").json()["experiment_storage"]
          assert storage["durable"] is False, storage
          assert storage["state"] == repo.STORAGE_STATE_UNAVAILABLE, storage
          assert storage["configured"] is True, storage
          # `backend` still reports what is SELECTED. The app has not fallen back;
          # it keeps trying, which is what lets it recover once the operator applies
          # the migration.
          assert storage["backend"] == repo.BACKEND_POSTGRES, storage

          # 6. AND NOTHING WAS WRITTEN. The failed create left no directory behind.
          assert sorted(p.name for p in pathlib.Path(ws.workspace_root()).iterdir()) == [rid]
          print("un-migrated database: reads degrade, the write fails typed, durability is NOT claimed")
          PY

      # The un-migrated fixture workspace is thrown away so no later step can read
      # a record that only existed to prove the degraded path.
      - name: Discard the un-migrated fixture workspace
        run: rm -rf /tmp/isaac-pg-unmigrated

      - name: Plan the migrations without applying them
        run: |
          set -euo pipefail
          out=$(python scripts/db_migrate.py --plan)
          echo "$out"
          # THE ORDER IS PART OF THE ASSERTION. `0002_runs` declares a foreign key
          # into `isaac_experiments`, so applying it first is a failure, not a
          # style preference.
          [ "$out" = "pending: 0001_experiments, 0002_runs" ] || {
            echo "::error::unexpected plan: $out"; exit 1; }
          # A plan must apply NOTHING. The bookkeeping table may exist (the plan
          # creates it to read it); no application table may.
          for t in isaac_experiments isaac_runs; do
            count=$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='$t'")
            [ "$count" = "0" ] || { echo "::error::--plan created $t"; exit 1; }
          done

      # LEGACY COMPATIBILITY, THE DIRECTION THAT IS EASY TO SKIP: a database
      # migrated to `0001` ONLY, running an application built at this commit. That
      # is not hypothetical — it is the hosted deployment as of 2026-08-09, and it
      # is the state of every deployment between merging `0002` and an operator
      # applying it. The migration set is filtered by copying one file into a temp
      # directory and passing it as `directory=`, which is the runner's own
      # documented parameter; nothing about the committed files changes.
      - name: Apply 0001 ONLY, and prove the app is unaffected while 0002 is pending
        env:
          ISAAC_UI_WORKSPACE: /tmp/isaac-pg-0001-only
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, shutil, sys, tempfile
          sys.path.insert(0, "apps/api")
          from isaac_api import db_migrate

          staged = pathlib.Path(tempfile.mkdtemp()) / "migrations"
          staged.mkdir()
          shutil.copy(
              db_migrate.MIGRATIONS_DIR / "0001_experiments.sql",
              staged / "0001_experiments.sql",
          )
          applied = db_migrate.migrate(os.environ, directory=staged)
          assert applied == ["0001_experiments"], applied
          # Against the REAL committed set, 0002 is now the only pending version.
          pending = db_migrate.pending_versions(os.environ)
          assert pending == ["0002_runs"], pending
          print("database migrated to 0001 only; 0002 pending")
          PY
          count=$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='isaac_runs'")
          [ "$count" = "0" ] || { echo "::error::isaac_runs exists but 0002 was not applied"; exit 1; }
          python - <<'PY'
          import sys
          sys.path.insert(0, "apps/api")
          from fastapi.testclient import TestClient
          import isaac_api.experiment_repository as repo
          from isaac_api.app import create_app

          client = TestClient(create_app())
          status = client.get("/api/health").json()["experiment_storage"]
          assert status["durable"] is True and status["backend"] == repo.BACKEND_POSTGRES, status

          created = client.post("/api/experiments", json={"title": "0002 pending"})
          assert created.status_code == 201, created.text
          rid = created.json()["id"]
          listed = client.get("/api/experiments").json()["experiments"]
          assert [row["id"] for row in listed] == [rid], listed
          assert client.get(f"/api/experiments/{rid}").status_code == 200
          # Durability is still claimed, because it is still true: nothing this
          # application does touches the table 0002 has not created yet.
          after = client.get("/api/health").json()["experiment_storage"]
          assert after == {
              "configured": True,
              "backend": "postgres",
              "durable": True,
              "state": repo.STORAGE_STATE_DURABLE,
          }, after
          print("0001-only database: create, read and list all work with 0002 pending")
          PY
          # Leave the table as the later steps expect to find it: empty.
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM isaac_experiments"
          rm -rf /tmp/isaac-pg-0001-only

      - name: Apply the remaining migration
        run: |
          set -euo pipefail
          out=$(python scripts/db_migrate.py --apply)
          echo "$out"
          # 0001 is already recorded, so ONLY 0002 applies. That the bookkeeping
          # skips an applied version is the property being read here; the
          # both-at-once path is proven by the bookkeeping-deletion case below.
          [ "$out" = "applied: 0002_runs" ] || {
            echo "::error::unexpected apply result: $out"; exit 1; }

      # THE IDEMPOTENCE CLAIM, PROVEN RATHER THAN ASSERTED IN A COMMENT.
      - name: Apply it a SECOND time and prove it is a no-op
        run: |
          set -euo pipefail
          before=$(psql -Atc "select md5(string_agg(table_name || '|' || column_name || '|' || data_type, ',' order by table_name, ordinal_position)) from information_schema.columns where table_schema='public'")
          out=$(python scripts/db_migrate.py --apply)
          echo "$out"
          [ "$out" = "nothing to apply (every migration is already recorded)" ] || {
            echo "::error::a second apply was not a no-op: $out"; exit 1; }
          after=$(psql -Atc "select md5(string_agg(table_name || '|' || column_name || '|' || data_type, ',' order by table_name, ordinal_position)) from information_schema.columns where table_schema='public'")
          [ "$before" = "$after" ] || { echo "::error::the schema changed on a re-run"; exit 1; }
          # And once more with the BOOKKEEPING DELETED, which is the harder half of
          # the claim: the file's own `CREATE ... IF NOT EXISTS` must carry it even
          # when the version table has lost the row.
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM isaac_schema_migrations"
          python scripts/db_migrate.py --apply
          recovered=$(psql -Atc "select md5(string_agg(table_name || '|' || column_name || '|' || data_type, ',' order by table_name, ordinal_position)) from information_schema.columns where table_schema='public'")
          [ "$before" = "$recovered" ] || {
            echo "::error::re-applying after losing the bookkeeping changed the schema"; exit 1; }

      # THE GUARD THE OWNER WILL MOST WANT TO SEE: exactly two new tables, and the
      # stand-in `records` untouched.
      - name: Diff the table set and prove `records` is byte-identical
        run: |
          set -euo pipefail
          psql -Atc "select table_name from information_schema.tables where table_schema='public' order by table_name" \
            > /tmp/tables-after.txt
          echo "--- before ---"; cat /tmp/tables-before.txt
          echo "--- after  ---"; cat /tmp/tables-after.txt
          added=$(comm -13 /tmp/tables-before.txt /tmp/tables-after.txt | tr '\n' ' ' | sed 's/ *$//')
          removed=$(comm -23 /tmp/tables-before.txt /tmp/tables-after.txt | tr '\n' ' ' | sed 's/ *$//')
          # EXACTLY three, and named. Contract §8 D7 lists six candidate tables;
          # `0002_runs` deliberately creates one of them, so this list is also the
          # guard against a later migration quietly bringing the other five along.
          [ "$added" = "isaac_experiments isaac_runs isaac_schema_migrations" ] || {
            echo "::error::the migration created tables it should not have: '$added'"; exit 1; }
          [ -z "$removed" ] || { echo "::error::the migration REMOVED tables: '$removed'"; exit 1; }
          psql -Atc "select md5(string_agg(record_id || data::text, '|' order by record_id)) from records" \
            > /tmp/records-after.txt
          diff /tmp/records-before.txt /tmp/records-after.txt || {
            echo "::error::the production-derived stand-in table was modified"; exit 1; }
          echo "records: byte-identical; added exactly the two application-owned tables"

      # The repository, end to end, against the real engine — the half the
      # in-process fake cannot cover.
      - name: Exercise the durable repository against the real engine
        env:
          ISAAC_UI_WORKSPACE: /tmp/isaac-pg-workspace
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "apps/api")
          from fastapi.testclient import TestClient
          import isaac_api.experiment_repository as repo
          import isaac_api.workspace as ws
          from isaac_api.app import create_app

          app = create_app()
          client = TestClient(app)

          status = client.get("/api/health").json()["experiment_storage"]
          assert status == {
              "configured": True,
              "backend": "postgres",
              "durable": True,
              "state": repo.STORAGE_STATE_DURABLE,
          }, status

          created = client.post("/api/experiments", json={"title": "CI durable"})
          assert created.status_code == 201, created.text
          rid = created.json()["id"]

          # It is really in the database, not only on disk.
          import isaac_api.db_write as dbw
          with dbw.write_transaction(os.environ) as (cur, pol):
              cur.execute(pol.check(repo.Q_ALL_EXPERIMENTS))
              rows = cur.fetchall()
          assert [r[0] for r in rows] == [rid], rows

          # Simulate a pod restart: throw the workspace directory away and read.
          import shutil
          shutil.rmtree(ws.workspace_root())
          listed = client.get("/api/experiments").json()["experiments"]
          assert [e["id"] for e in listed] == [rid], listed
          assert client.get(f"/api/experiments/{rid}").status_code == 200

          # TUTORIAL ISOLATION, against the real engine.
          session = client.post("/api/tutorial/sessions").json()["session_id"]
          headers = {"X-Isaac-Tutorial-Session": session}
          refused = client.post("/api/experiments", json={"title": "no"}, headers=headers)
          assert refused.status_code == 409, refused.text
          with dbw.write_transaction(os.environ) as (cur, pol):
              cur.execute(pol.check(repo.Q_ALL_EXPERIMENTS))
              after = cur.fetchall()
          assert [r[0] for r in after] == [rid], "a session write reached the database"
          # ...and the five examples the session materialised are not in it either.
          assert set(r[0] for r in after).isdisjoint(ws.CANONICAL_IDS)

          # ── THE DURABLE COMPARE-AND-SWAP (defect C1) ─────────────────────────
          # THE HALF THAT CANNOT BE PROVEN ANYWHERE ELSE. The in-process fake in
          # `test_experiment_repository.py` reports the server's DECISION, so it
          # proves the application handles a refusal; only a real engine can say
          # whether the PREDICATE decides correctly. Before this predicate existed
          # the conflict clause was a bare `DO UPDATE SET state = EXCLUDED.state`,
          # so case 2 below silently overwrote — with both writers told they had
          # succeeded.
          import json as _json

          def upsert(state):
              with dbw.write_transaction(os.environ) as (cur, pol):
                  cur.execute(
                      pol.check(repo.Q_UPSERT_EXPERIMENT),
                      (state["id"], _json.dumps(state, sort_keys=True)),
                  )
                  return cur.rowcount

          def stored_state():
              with dbw.write_transaction(os.environ) as (cur, pol):
                  cur.execute(pol.check(repo.Q_ONE_EXPERIMENT), (rid,))
                  value = cur.fetchone()[0]
              return _json.loads(value) if isinstance(value, (str, bytes)) else value

          base = ws.load_experiment(rid).to_state()
          assert base["rev"] == 0, base["rev"]

          # 1. STRICTLY AHEAD -> applied. The ordinary case.
          assert upsert(dict(base, rev=1, title="rev 1 wins")) == 1
          assert stored_state()["title"] == "rev 1 wins"

          # 2. A STALE WRITE IS REFUSED. THIS IS THE DEFECT. A second replica whose
          #    copy is behind must not win, and must be told it did not.
          assert upsert(dict(base, rev=1, title="stale writer overwrites")) == 0, \
              "a stale write was applied"
          assert stored_state()["title"] == "rev 1 wins", "the stale write landed anyway"

          # 3. BEHIND -> refused, for the same reason.
          assert upsert(dict(base, rev=0, title="behind")) == 0
          assert stored_state()["title"] == "rev 1 wins"

          # 4. A BYTE-IDENTICAL DOCUMENT AT AN EQUAL REV -> admitted. This is
          #    clause 3, and it is NOT the retry-after-a-partial-failure case the
          #    comment here used to claim: `save_versioned` re-stamps `updated_utc`
          #    (one-second resolution) INSIDE the compared document, so a real retry
          #    matches only within the same wall-clock second. What is proven here
          #    is exactly what the clause says — an identical document is admitted,
          #    and `rev` being inside the document makes applying it a no-op in
          #    every field. The partial-failure wedge is closed by the application
          #    (case 7), not by this clause.
          assert upsert(dict(base, rev=1, title="rev 1 wins")) == 1
          assert stored_state()["title"] == "rev 1 wins"

          # 5. A FRESH GENERATION -> admitted even though its rev restarts at 0. A
          #    re-creation is a new object, and a random nonce cannot be ordered.
          reborn = dict(base, rev=0, generation="ffffffffffffffff", title="recreated")
          assert upsert(reborn) == 1
          assert stored_state()["title"] == "recreated"

          # 6. THE STATED LIMIT OF (5), asserted rather than glossed: because two
          #    generations cannot be ordered, the OLD generation is admitted over
          #    the new one too. Within a generation the swap is strict; across one
          #    it is last-writer-wins. Not reachable in this build — nothing deletes
          #    and re-creates an ordinary-scope record — and documented at
          #    `Q_UPSERT_EXPERIMENT` so it is a known property, not a surprise.
          #
          #    CLAUSE 1 IS ISOLATED HERE, AND IT WAS NOT BEFORE. The offer used to
          #    carry `rev=99` against a row holding `rev=0`, which clause 2 admits
          #    on its own — the assertion would have passed with clause 1 deleted,
          #    which is the "asserts more than it observes" defect in the one place
          #    meant to be the real-engine proof. It now offers a rev that is NOT
          #    ahead and a document that is NOT identical, so clause 1 is the only
          #    clause that can admit it.
          assert stored_state()["rev"] == 0, stored_state()["rev"]
          assert upsert(dict(base, rev=0, title="old generation")) == 1
          assert stored_state()["title"] == "old generation"

          # 6b. THE CONTROL that gives (6) its meaning: the same not-ahead,
          #     not-identical offer carrying the row's OWN generation is REFUSED. So
          #     what admitted (6) was the differing generation and nothing else.
          assert upsert(dict(base, rev=0, title="same generation, not ahead")) == 0
          assert stored_state()["title"] == "old generation"

          # 7. THE WEDGE, AND ITS RECOVERY — the reason clause 2 is safe to ship.
          #    A strict compare-and-swap over storage that can drift AHEAD of the
          #    local workspace file is a permanent 412 unless something reconciles
          #    them: every later mutation offers `max(self.rev, disk_rev) + 1`,
          #    which is the rev the row already holds. The row gets ahead of the
          #    file two ordinary ways — a fault between `save()`'s two writes, and a
          #    replica that hydrated the record earlier (`hydrate` skips a record
          #    whose `experiment.json` is already present, so it never refreshes
          #    one). Simulated by moving the ROW forward and leaving the FILE alone.
          on_disk = ws.load_experiment(rid)
          wedged_rev = on_disk.rev + 7
          assert upsert(dict(on_disk.to_state(), rev=wedged_rev, title="a replica won")) == 1
          assert ws.load_experiment(rid).rev == on_disk.rev, "the file moved; no wedge to test"

          answers = ws.load_demo_answers()
          payload = {
              "confirmed_by_user": True,
              "answers": {
                  "series": answers.get("series"),
                  "descriptor": answers.get("descriptor"),
              },
          }
          etag = client.get(f"/api/experiments/{rid}").headers["ETag"]
          refused_write = client.post(
              f"/api/experiments/{rid}/answers", json=payload, headers={"If-Match": etag}
          )
          assert refused_write.status_code == 412, refused_write.text
          assert refused_write.json()["current_rev"] == wedged_rev, refused_write.text

          #    THE RECOVERY. The refusal adopted the winner's document into the
          #    workspace file on its way out, so a re-read returns the winner rather
          #    than the same stale copy...
          refreshed = client.get(f"/api/experiments/{rid}")
          assert refreshed.json()["rev"] == wedged_rev, refreshed.text
          #    ...and the retry, now strictly ahead, is APPLIED. Before the local
          #    adoption this second call was another 412, and so was every one after
          #    it.
          retried = client.post(
              f"/api/experiments/{rid}/answers",
              json=payload,
              headers={"If-Match": refreshed.headers["ETag"]},
          )
          assert retried.status_code == 200, retried.text
          assert stored_state()["rev"] == wedged_rev + 1, stored_state()["rev"]

          # The row is left holding whatever case 7 last wrote through the API. No
          # later step reads it — the digests that follow are taken over `records`
          # and over the table SET, never over this application's own rows.
          print("durable compare-and-swap OK against a real PostgreSQL")
          print("durable repository OK against a real PostgreSQL")
          PY
          # 0002 IS INERT FOR THIS BUILD, proven behaviourally rather than by
          # reading the source: the application has just created, listed,
          # hydrated, refused and raced against a real engine with `isaac_runs`
          # present, and has written nothing into it.
          runs=$(psql -Atc "select count(*) from isaac_runs")
          [ "$runs" = "0" ] || {
            echo "::error::the application wrote $runs row(s) into isaac_runs"; exit 1; }
          echo "isaac_runs: still empty after the application ran"

      # THE SAME DIGEST, TAKEN AFTER THE APPLICATION HAS ACTUALLY RUN.
      #
      # The step above already proved the MIGRATION does not touch `records`. That
      # is the smaller half of the claim. This one proves the RUNNING APPLICATION
      # does not either — after it has opened write transactions, created records,
      # upserted state, hydrated a wiped workspace, and refused a session write.
      # Without it, "the production-derived sample is untouched" would be a
      # statement about DDL only, and the thing the owner is actually being asked
      # to trust is the write path.
      #
      # It is checked here rather than only after the rollback so that a failure
      # names the application as the cause, instead of arriving mixed together with
      # a rollback failure.
      - name: Prove the RUNNING APPLICATION left `records` byte-identical
        run: |
          set -euo pipefail
          psql -Atc "select md5(string_agg(record_id || data::text, '|' order by record_id)) from records" \
            > /tmp/records-after-app.txt
          diff /tmp/records-before.txt /tmp/records-after-app.txt || {
            echo "::error::the application modified the production-derived stand-in table"; exit 1; }
          # ...and it did not quietly add anything of its own beside it either.
          psql -Atc "select table_name from information_schema.tables where table_schema='public' order by table_name" \
            > /tmp/tables-after-app.txt
          diff /tmp/tables-after.txt /tmp/tables-after-app.txt || {
            echo "::error::running the application changed the table set"; exit 1; }
          echo "records: byte-identical after the application ran; table set unchanged"

      # EVERY CONSTRAINT `0002_runs` DECLARES, EXERCISED AGAINST THE REAL ENGINE.
      #
      # `docs/migration-approval-packet-0002.md` claims a primary key, a foreign
      # key that REFUSES a parent delete, an id-shape CHECK, two non-negativity
      # CHECKs, a jsonb-object CHECK and a document-identity CHECK — and claims the
      # ABSENCE of a uniqueness constraint on `(experiment_id, ordinal)`. Nothing
      # in the Python test suite can check any of that: it has no PostgreSQL, so it
      # can only assert the constraint text is present. This step asserts the
      # constraints BEHAVE.
      #
      # It runs after the application-behaviour digests deliberately, so its rows
      # cannot perturb them, and it removes its own rows at the end.
      - name: Prove every 0002 constraint rejects what it claims to reject
        run: |
          set -euo pipefail

          # THE THIRD ARGUMENT IS WHAT MAKES THIS A TEST RATHER THAN A FORMALITY.
          # "the statement failed" is satisfied by a typo, a missing column, or a
          # syntax error, so a refusal check that only reads the exit code passes
          # for reasons that have nothing to do with the constraint under test.
          # Each case therefore names the object PostgreSQL must blame.
          refuse() {
            if psql -v ON_ERROR_STOP=1 -c "$2" > /tmp/refuse.log 2>&1; then
              echo "::error::ACCEPTED a statement that must be refused: $1"; exit 1
            fi
            if ! grep -q -- "$3" /tmp/refuse.log; then
              echo "::error::$1 was refused, but not by '$3':"; cat /tmp/refuse.log; exit 1
            fi
            echo "refused as designed by $3: $1"
          }

          parent=01CICONSTRAINTPARENT000000
          run=01CIRUNAAAAAAAAAAAAAAAAAAA

          psql -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO isaac_experiments (experiment_id, state)
            VALUES ('$parent', '{"id": "$parent"}');
          INSERT INTO isaac_runs (run_id, experiment_id, ordinal, state, rev, generation)
            VALUES ('$run', '$parent', 0,
                    '{"id": "$run", "experiment_id": "$parent"}', 0, 'ci');
          SQL
          echo "a well-formed run row inserts"

          refuse "an orphan run" \
            "INSERT INTO isaac_runs (run_id, experiment_id, state, generation) VALUES ('01CIORPHANAAAAAAAAAAAAAAAA', '01CINOSUCHPARENT0000000000', '{\"id\": \"01CIORPHANAAAAAAAAAAAAAAAA\"}', 'ci')" \
            "isaac_runs_experiment_fk"
          refuse "a malformed run id" \
            "INSERT INTO isaac_runs (run_id, experiment_id, state, generation) VALUES ('not-a-ulid', '$parent', '{}', 'ci')" \
            "isaac_runs_id_shape"
          refuse "a duplicate run id" \
            "INSERT INTO isaac_runs (run_id, experiment_id, state, generation) VALUES ('$run', '$parent', '{\"id\": \"$run\", \"experiment_id\": \"$parent\"}', 'ci')" \
            "isaac_runs_pkey"
          refuse "a negative ordinal" \
            "INSERT INTO isaac_runs (run_id, experiment_id, ordinal, state, generation) VALUES ('01CIBADORDINAL000000000000', '$parent', -1, '{}', 'ci')" \
            "isaac_runs_ordinal_non_negative"
          refuse "a negative rev" \
            "INSERT INTO isaac_runs (run_id, experiment_id, state, rev, generation) VALUES ('01CIBADREV0000000000000000', '$parent', '{}', -1, 'ci')" \
            "isaac_runs_rev_non_negative"
          refuse "a non-object state document" \
            "INSERT INTO isaac_runs (run_id, experiment_id, state, generation) VALUES ('01CIBADSTATE00000000000000', '$parent', '\"nope\"', 'ci')" \
            "isaac_runs_state_is_object"
          refuse "a document naming a different run" \
            "INSERT INTO isaac_runs (run_id, experiment_id, state, generation) VALUES ('01CIBADIDENTITY00000000000', '$parent', '{\"id\": \"01CISOMEOTHERRUN0000000000\"}', 'ci')" \
            "isaac_runs_document_identity"
          refuse "a document naming a different experiment" \
            "INSERT INTO isaac_runs (run_id, experiment_id, state, generation) VALUES ('01CIBADPARENTREF0000000000', '$parent', '{\"experiment_id\": \"01CISOMEOTHEREXP0000000000\"}', 'ci')" \
            "isaac_runs_document_identity"
          # The only column here with no DEFAULT, so omitting it is the whole test.
          refuse "a NULL generation" \
            "INSERT INTO isaac_runs (run_id, experiment_id, state) VALUES ('01CINOGENERATION0000000000', '$parent', '{}')" \
            "violates not-null constraint"

          # THE FOREIGN KEY REFUSES A PARENT DELETE. This is the assertion that
          # distinguishes the shipped design from `ON DELETE CASCADE`: a single
          # DELETE against the experiments table must NOT silently destroy runs.
          refuse "deleting an experiment that still has runs" \
            "DELETE FROM isaac_experiments WHERE experiment_id = '$parent'" \
            "isaac_runs_experiment_fk"
          survived=$(psql -Atc "select count(*) from isaac_runs where run_id = '$run'")
          [ "$survived" = "1" ] || { echo "::error::the run was destroyed by a refused parent delete"; exit 1; }

          # THE TWO ABSENCES, asserted positively — a constraint that is NOT there
          # is as much a decision as one that is, and only a real engine can show
          # the row is admitted.
          psql -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO isaac_runs (run_id, experiment_id, ordinal, state, generation)
            VALUES ('01CISAMEORDINAL00000000000', '$parent', 0,
                    '{"id": "01CISAMEORDINAL00000000000", "experiment_id": "$parent"}', 'ci');
          INSERT INTO isaac_runs (run_id, experiment_id, state, generation)
            VALUES ('01CILEGACYDOCUMENT00000000', '$parent', '{}', 'ci');
          SQL
          echo "admitted as designed: a second run at the same ordinal, and a document with no id"

          # THE LEGACY DOCUMENT THIS APPLICATION CAN ACTUALLY PRODUCE — which is
          # NOT the bare `'{}'` inserted above, and the difference is the whole
          # point of this block.
          #
          # `'{}'` exercises the NULL path: `->>` on an absent key yields NULL, a
          # comparison against NULL is NULL, and a CHECK passes unless it is FALSE.
          # No document `Run.to_state()` emits looks like that. It emits EVERY key
          # unconditionally, and `Run.from_state` reads each string through
          # `_as_str`, which returns `''` for an absent one — so a legacy run
          # hydrated from a pre-`experiment_id` document carries
          # `"experiment_id": ""`. `'' = experiment_id` is FALSE, not NULL, and the
          # original CHECK REFUSED it. `_hydrate_runs` documents that
          # `experiment_id` is deliberately NOT repaired from the owning
          # experiment, so the shape is reachable and permanent, and the backfill
          # slice is where it would have bitten.
          #
          # THE DOCUMENT IS GENERATED BY THE APPLICATION, never hand-written here.
          # A hand-written approximation is what let the original claim stand: it
          # would test the shape the author believed in rather than the shape the
          # code emits.
          legacy_state=$(python - <<'PY'
          import json, sys
          sys.path.insert(0, "apps/api")
          from isaac_api.workspace import Run

          state = Run.from_state(
              {"id": "01CILEGACYRUN00000000000AA", "label": "old", "draft": {}}
          ).to_state()
          assert state["experiment_id"] == "", state["experiment_id"]
          assert "'" not in json.dumps(state), "the document would break the SQL literal"
          print(json.dumps(state))
          PY
          )
          echo "application-produced legacy document: $legacy_state"
          psql -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO isaac_runs (run_id, experiment_id, state, generation)
            VALUES ('01CILEGACYRUN00000000000AA', '$parent', '$legacy_state', 'ci');
          SQL
          admitted=$(psql -Atc "select count(*) from isaac_runs where run_id = '01CILEGACYRUN00000000000AA'")
          [ "$admitted" = "1" ] || {
            echo "::error::the legacy shape this application produces was REFUSED"; exit 1; }
          echo "admitted as designed: a document whose experiment_id is the empty string"

          # AND THE RELAXATION IS NARROW. Tolerating `''` must not tolerate a
          # document naming a DIFFERENT experiment — the only thing this CHECK
          # exists to refuse. Asserted right here, so the two can never drift.
          refuse "a document whose experiment_id names another experiment" \
            "INSERT INTO isaac_runs (run_id, experiment_id, state, generation) VALUES ('01CIWRONGPARENT00000000000', '$parent', '{\"id\": \"01CIWRONGPARENT00000000000\", \"experiment_id\": \"01CISOMEOTHEREXP0000000000\"}', 'ci')" \
            "isaac_runs_document_identity"
          # ...and an EMPTY `id` is still refused, because `_hydrate_runs` drops a
          # run with no id, so no persisted document can carry one. The asymmetry
          # between the two keys is a decision, and this is where it is measured.
          refuse "a document whose id is the empty string" \
            "INSERT INTO isaac_runs (run_id, experiment_id, state, generation) VALUES ('01CIEMPTYDOCID0000000000AA', '$parent', '{\"id\": \"\", \"experiment_id\": \"$parent\"}', 'ci')" \
            "isaac_runs_document_identity"

          # The index the packet names actually exists.
          idx=$(psql -Atc "select indexdef from pg_indexes where tablename='isaac_runs' and indexname='isaac_runs_experiment_order_idx'")
          echo "$idx"
          case "$idx" in
            *"(experiment_id, ordinal, run_id)") : ;;
            *) echo "::error::isaac_runs_experiment_order_idx is missing or has the wrong columns"; exit 1 ;;
          esac

          # ...and once the runs are gone, the same parent delete succeeds — so
          # what refused it above was the foreign key and nothing else.
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM isaac_runs WHERE experiment_id = '$parent'"
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM isaac_experiments WHERE experiment_id = '$parent'"
          left=$(psql -Atc "select count(*) from isaac_runs")
          [ "$left" = "0" ] || { echo "::error::this step left rows behind"; exit 1; }
          echo "0002 constraints: every one behaves as the approval packet describes"

      # ROLLBACK ORDER IS NOT A DETAIL. `0001_experiments.rollback.sql` drops
      # `isaac_experiments` WITHOUT `CASCADE`, and `isaac_runs` references it — so
      # rolling back 0001 first FAILS. That is the safe failure (nothing is
      # destroyed), and it is asserted rather than assumed because an operator
      # reaching for a rollback is not in a mood to debug a dependency error.
      - name: Prove rolling the migrations back in the WRONG order fails safely
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 -f apps/api/isaac_api/migrations/0001_experiments.rollback.sql > /tmp/wrong-order.log 2>&1; then
            echo "::error::0001's rollback succeeded while isaac_runs still referenced isaac_experiments"
            exit 1
          fi
          cat /tmp/wrong-order.log
          for t in isaac_experiments isaac_runs isaac_schema_migrations; do
            c=$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='$t'")
            [ "$c" = "1" ] || { echo "::error::$t was destroyed by the failed rollback attempt"; exit 1; }
          done
          echo "wrong-order rollback: refused, and nothing was dropped"

      # THE ROLLBACKS, PROVEN, IN THE DOCUMENTED ORDER. They are operator actions
      # run with psql — the application cannot run either file, because each
      # contains a DROP and the write path's statement policy refuses those, and
      # `load_migrations` excludes `*.rollback.sql` by suffix.
      - name: Prove the documented rollbacks return the database to its prior state
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f apps/api/isaac_api/migrations/0002_runs.rollback.sql
          gone=$(psql -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='isaac_runs'")
          [ "$gone" = "0" ] || { echo "::error::0002's rollback left isaac_runs behind"; exit 1; }
          # THE BOOKKEEPING ROW IS GONE TOO, which is what makes the rollback
          # re-appliable. Without it, `--apply` would print "nothing to apply" over
          # a table that no longer exists — a silent, unrecoverable trap.
          rows=$(psql -Atc "select count(*) from isaac_schema_migrations where version = '0002_runs'")
          [ "$rows" = "0" ] || { echo "::error::0002's rollback left its bookkeeping row"; exit 1; }
          plan=$(python scripts/db_migrate.py --plan)
          echo "$plan"
          [ "$plan" = "pending: 0002_runs" ] || {
            echo "::error::after the 0002 rollback the plan is wrong: $plan"; exit 1; }

          psql -v ON_ERROR_STOP=1 -f apps/api/isaac_api/migrations/0001_experiments.rollback.sql
          psql -Atc "select table_name from information_schema.tables where table_schema='public' order by table_name" \
            > /tmp/tables-rolled-back.txt
          diff /tmp/tables-before.txt /tmp/tables-rolled-back.txt || {
            echo "::error::rollback did not restore the pre-migration table set"; exit 1; }
          psql -Atc "select md5(string_agg(record_id || data::text, '|' order by record_id)) from records" \
            > /tmp/records-rolled-back.txt
          diff /tmp/records-before.txt /tmp/records-rolled-back.txt || {
            echo "::error::rollback modified the production-derived stand-in table"; exit 1; }
          echo "rollback OK: pre-migration table set restored, records untouched"

  frontend:
    name: frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  browser-a11y:
    name: browser accessibility and responsive baseline
    runs-on: ubuntu-latest

    # A NEW, additive job. It does not modify, gate or depend on `test` or
    # `frontend`; those two remain exactly as they were.
    #
    # What it does: boots the FastAPI backend with NO database and NO
    # credentials, then runs the Playwright suite (Chromium only) across five
    # viewport/zoom projects. `e2e/global-setup.ts` opens ONE worked-example
    # session (POST /api/tutorial/sessions) for the whole run and publishes its
    # id to the workers; that is where the five committed example records are
    # materialised.
    #
    # CORRECTED: this said the job "seeds the committed synthetic fixtures
    # through the seeding read GET /api/experiments (ensure_seeded)". There is no
    # seeding read any more — `list_experiments` / `load_experiment` never seed,
    # `ensure_seeded()` is gone, and setup ASSERTS the ordinary workspace is
    # empty rather than filling it.
    #
    # What it deliberately does NOT do: contact any database (no PG* variable
    # is ever set), publish an image, write to the workspace beyond the one
    # worked-example session, or touch the hosted /krish deployment — which is
    # behind an Authentik edge and is not reachable from CI at all.

    env:
      # Must stay 5173: it is the port the backend's DEFAULT CORS allow-list
      # permits (apps/api/isaac_api/app.py → DEFAULT_CORS_ORIGINS).
      E2E_WEB_PORT: "5173"
      E2E_API_BASE: "http://127.0.0.1:8000/api"
      # Ephemeral, runner-local workspace. Nothing persists past the job.
      ISAAC_UI_WORKSPACE: /tmp/isaac-e2e-workspace

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Start backend (no database, no credentials, synthetic only)
        run: |
          nohup uvicorn isaac_api.app:app --app-dir apps/api \
            --host 127.0.0.1 --port 8000 > /tmp/isaac-api.log 2>&1 &
          echo "started"

      - name: Wait for backend readiness (bounded ~60s)
        run: |
          ready=""
          last="000"
          for _ in $(seq 1 30); do
            last=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            if [ "$last" = "200" ]; then ready="yes"; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::backend not ready within ~60s (last health code=$last)"
            echo "---- backend log ----"
            cat /tmp/isaac-api.log || true
            exit 1
          fi
          echo "backend ready (health=200)"

      - name: Confirm synthetic-only mode
        run: |
          mode=$(curl -s http://127.0.0.1:8000/api/health | jq -r '.mode // empty')
          [ "$mode" = "synthetic-only" ] || {
            echo "::error::expected mode=synthetic-only, got '$mode'"; exit 1; }
          echo "mode=$mode"

      # The suite's own global-setup ALSO seeds (idempotently). Doing it here
      # too keeps the failure legible: a seeding problem shows up as a curl
      # step, not as 470 browser tests timing out.
      # Verify BOTH scopes independently, because the ordinary workspace is now
      # permanently empty and the built-in examples exist only inside a
      # worked-example session.
      #
      # The old step POSTed `/api/demo/run` and asserted `>= 5` experiments in the
      # ordinary scope. Both halves are now wrong by design: `/demo/run` REQUIRES a
      # session header and refuses without one, and the ordinary list is empty. The
      # 409 is avoided by not making an unscoped example-workspace call at all —
      # not by tolerating it, which would have hidden a real regression.
      #
      # Playwright's own global setup opens the session the browser tests use; this
      # step is a fail-fast contract check on the backend before 200+ specs run.
      - name: Verify both workspace scopes
        run: |
          set -euo pipefail

          # 1. The ORDINARY scope must be empty. Nothing in this build can create a
          #    record, so a non-zero count here means the seed leaked back into it.
          ordinary=$(curl -sS http://127.0.0.1:8000/api/experiments | jq '.experiments | length')
          [ "$ordinary" -eq 0 ] || {
            echo "::error::ordinary scope must be empty, got $ordinary experiment(s)"; exit 1; }
          echo "ordinary scope: empty (correct)"

          # 2. An unscoped example-workspace call must REFUSE without mutating.
          #    Asserted, not ignored: a silent success would mean /demo/run had
          #    regained the ability to write into the ordinary workspace.
          #
          #    THE EXACT STATUS AND THE TYPED ERROR CODE, not "any 4xx". The contract
          #    is `409 {"error": "tutorial_scope_required"}` (routes.py
          #    `_tutorial_scope_required`), and a `case 4*)` accepted anything in the
          #    400s — so a 401 from an authenticating edge, a 404 from a deleted
          #    route, or a 422 from a rejected body would all have been reported as
          #    "refused (correct)" while the property under test (this endpoint
          #    refuses BECAUSE it requires a session scope) had stopped holding.
          code=$(curl -sS -o /tmp/demo_run_unscoped.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/api/demo/run \
            -H 'content-type: application/json' -d '{"mode":"draft_only"}')
          [ "$code" = "409" ] || {
            echo "::error::unscoped /demo/run returned $code, expected 409"
            cat /tmp/demo_run_unscoped.json; exit 1; }
          err=$(jq -r '.error // empty' /tmp/demo_run_unscoped.json)
          [ "$err" = "tutorial_scope_required" ] || {
            echo "::error::unscoped /demo/run refused with error='$err', expected 'tutorial_scope_required'"
            cat /tmp/demo_run_unscoped.json; exit 1; }
          echo "unscoped /demo/run refused with 409 tutorial_scope_required (correct)"
          still=$(curl -sS http://127.0.0.1:8000/api/experiments | jq '.experiments | length')
          [ "$still" -eq 0 ] || {
            echo "::error::refused /demo/run still mutated the ordinary scope ($still)"; exit 1; }

          # 3. A worked-example session must hold the five built-in examples.
          curl -sS -X POST http://127.0.0.1:8000/api/tutorial/sessions -o /tmp/session.json
          sid=$(jq -re '.session_id' /tmp/session.json)
          scoped=$(curl -sS -H "X-Isaac-Tutorial-Session: $sid" \
            http://127.0.0.1:8000/api/experiments | jq '.experiments | length')
          [ "$scoped" -eq 5 ] || {
            echo "::error::expected 5 examples in the session, got $scoped"; exit 1; }
          echo "session scope: 5 examples (correct)"

          # 4. Fail closed: an unknown session must 404 and must NOT be answered
          #    from the ordinary workspace.
          unknown=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'X-Isaac-Tutorial-Session: doesNotExistSession0' \
            http://127.0.0.1:8000/api/experiments)
          [ "$unknown" = "404" ] || {
            echo "::error::unknown session returned $unknown, expected 404"; exit 1; }
          echo "unknown session: 404 (fail-closed)"

          # This probe session is not the one the browser suite uses; discard it so
          # it does not linger for the TTL sweep.
          curl -sS -X DELETE "http://127.0.0.1:8000/api/tutorial/sessions/$sid" -o /dev/null

      - name: Typecheck the e2e suite
        working-directory: apps/web
        run: npm run typecheck:e2e

      - name: Run browser accessibility and responsive suite
        working-directory: apps/web
        run: npm run test:e2e

      # R3 — the MUTATION suite, run after the read-only one and deliberately NOT
      # merged into it.
      #
      # It starts its own backend, its own ISAAC_UI_WORKSPACE and its own dev server
      # (see `playwright.mutation.config.ts`), so it cannot disturb the read-only
      # suite's shared seeded workspace — whose assertions are about canonical seed
      # CONTENT and would fail if a spec answered a question or exported a record.
      #
      # Placed AFTER the read-only run so that a failure here is unambiguous in the
      # log rather than interleaved with it. That is presentation, not a dependency:
      # the two share no state.
      - name: Run browser mutation suite (own backend, own workspace)
        working-directory: apps/web
        run: npm run test:e2e:mutation

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/isaac-api.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
