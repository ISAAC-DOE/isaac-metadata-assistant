[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-records"
version = "0.1.0"
description = "Deterministic core for ISAAC metadata records: schema validation, evidence enforcement, audit, and export."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21",
    "python-ulid>=2.0",
    "openpyxl>=3.1",
    # IANA time-zone data shipped with ISAAC, so a zone name a scientist gives (including the
    # IANA "backward" links such as US/Pacific or Asia/Calcutta) is recognised the same way on
    # every machine. zoneinfo reads the operating system's database first and falls back to
    # this package; newer Debian/Ubuntu move those links into a separate tzdata-legacy package.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# pyyaml is a TEST-ONLY dependency and earns its place: `test_release_gate.py`
# asserts that the publishing job still cannot run without the CI gate, and a
# regex over workflow YAML can be defeated by a reformat. The one thing this
# slice must guarantee is that the gate cannot be quietly un-wired, so the check
# parses the workflow rather than pattern-matching it — and must never skip.
dev = ["pytest>=8", "pyyaml>=6"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "psycopg2-binary>=2.9"]
# Local-first XAS processing (`isaac process`: isaac.xas.v1 = the vendored xas-analysis reduction engine,
# src/xas_analysis, plus the ISAAC adapter; isaac.xas.v0 for what that engine does not cover). Optional and
# imported lazily: without it, processing reports `processing_unavailable`. Not in `api`, so the Docker
# image does not change. scipy, pyyaml and matplotlib are xas-analysis's own dependencies (xraylarch
# pulls them in too; named here so the engine does not depend on that).
processing = ["numpy>=2", "xraylarch>=2026.3", "scipy>=1.10", "pyyaml>=6", "matplotlib>=3.7"]

[project.scripts]
isaac = "isaac_records.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# the vendored xas-analysis engine reads its McMaster table and FEFF reference from package data, and ships its
# own skill references as documentation (src/xas_analysis/PROVENANCE.md)
xas_analysis = ["data/*.json", "data/*.dat", "skill/SKILL.md", "skill/scope.md", "skill/references/calibration.md",
                "skill/references/normalization.md", "skill/references/recipe.md", "PROVENANCE.md"]

[tool.pytest.ini_options]
# `src` is listed FIRST so a test run always exercises the checkout it was
# launched from. The venv's editable install pins `isaac_records` to one absolute
# path (`<main checkout>/src`), so without this line a run started inside a git
# WORKTREE silently tested that other checkout's truth core against this one's
# `apps/` — two different trees, reported as one result. On the main checkout the
# two paths are the same directory, so this changes nothing there; it only stops
# the resolution from depending on which checkout happens to be installed.
pythonpath = ["src", "apps/api"]
testpaths = ["tests", "apps/api/tests"]
