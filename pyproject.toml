[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-records"
version = "0.1.0"
description = "Deterministic core for ISAAC metadata records: schema validation, evidence enforcement, audit, and export."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21",
    "python-ulid>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
isaac = "isaac_records.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
